<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b1d"><meta name="description" content="点亮星星，画出属于你的星座。"><title>星座画布 · Ahicue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a19;color:#f4f1ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.page{min-height:100svh;max-width:1500px;margin:auto;padding:0 clamp(20px,5vw,76px);position:relative;overflow:hidden}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 30%,#5c3d954f,transparent 35%),radial-gradient(ellipse at 20% 75%,#19385e42,transparent 42%)}header,main,footer{position:relative}header{height:86px;border-bottom:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{color:#e9e4ff;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.15em}.logo span{font-size:23px;color:#c7adff;margin-right:10px}.tag{font-size:10px;letter-spacing:.18em;color:#aaa4ce}main{padding:52px 0 65px}.heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#b8a6e8;font-weight:700}h1{font-size:clamp(38px,5vw,62px);letter-spacing:-.06em;margin:12px 0;color:#f5f2ff}h1 span{color:#c5a5ff}.intro{color:#b3b3ca;font-size:14px;line-height:1.8;margin:0}.counter{color:#aea7ca;font-size:11px;letter-spacing:.1em;white-space:nowrap}.counter strong{color:#eee8ff;font-size:23px;margin-right:5px}.sky{height:min(62vh,620px);min-height:360px;position:relative;overflow:hidden;border:1px solid #bfa7ff40;background:radial-gradient(ellipse at 35% 40%,#48306770,transparent 45%),radial-gradient(ellipse at 72% 60%,#25516b55,transparent 43%),#0e1228;box-shadow:0 20px 70px #0005;touch-action:manipulation}.sky:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff88 0 1px,transparent 1.4px),radial-gradient(circle,#bdabf966 0 1px,transparent 1.5px);background-size:83px 97px,127px 113px;opacity:.48}.sky svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sky line{stroke:#dfcaff;stroke-width:1.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #bb98ff);opacity:.85}.star{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;width:36px;height:36px;padding:0;cursor:pointer;display:grid;place-items:center;color:#e6e1ff}.star:before{content:"";width:var(--size,6px);height:var(--size,6px);border-radius:50%;background:#eae4ff;box-shadow:0 0 8px #c6b3ff,0 0 20px #9f84ff;transition:transform .2s,box-shadow .2s}.star:hover:before,.star:focus-visible:before{transform:scale(1.8);box-shadow:0 0 10px #fff,0 0 25px #d8adff}.star:focus-visible{outline:1px solid #e2d6ff;outline-offset:-2px;border-radius:50%}.star.selected:before{background:#fff;transform:scale(1.8);box-shadow:0 0 10px #fff,0 0 30px #d2a7ff}.sky-note{position:absolute;left:20px;bottom:17px;font-size:10px;color:#bcb5da;letter-spacing:.14em;pointer-events:none}.tools{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px}.tools p{font-size:13px;color:#adaec6;line-height:1.7;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{border:1px solid #ba9eee55;background:#1c1a36;color:#eee9ff;padding:12px 17px;font:600 12px system-ui,sans-serif;cursor:pointer}.actions button:hover{background:#3c315d}.actions button:focus-visible{outline:2px solid #d9c6ff;outline-offset:3px}.actions button.primary{background:#d8c6ff;color:#17132b;border-color:#d8c6ff}.actions button:disabled{opacity:.38;cursor:default}footer{border-top:1px solid #ffffff20;padding:22px 0 30px;display:flex;justify-content:space-between;color:#8e8ba8;font-size:10px;letter-spacing:.15em}footer a{color:inherit;text-decoration:none}@media(max-width:650px){header{height:72px}.tag{font-size:9px}.heading{display:block}.counter{margin-top:15px}.sky{height:52vh;min-height:340px}.tools{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.sky-note{font-size:9px}.page{padding:0 20px}main{padding:38px 0 50px}}
.studio{margin-top:28px;padding:24px;border:1px solid #bfa7ff35;background:#14152dc7;display:grid;grid-template-columns:minmax(180px,1fr) auto;align-items:end;gap:16px}.studio label{display:block;color:#c6bce0;font-size:12px;margin-bottom:8px}.studio input{width:100%;max-width:440px;background:#0d1024;border:1px solid #a99ac84d;color:#f8f5ff;font:15px system-ui,sans-serif;padding:12px 14px;border-radius:2px}.studio input:focus-visible,.gallery button:focus-visible{outline:2px solid #d9c6ff;outline-offset:3px}.studio p{font-size:12px;line-height:1.7;color:#aaa6c0;margin:8px 0 0}.gallery{margin-top:55px;border-top:1px solid #ffffff20;padding-top:42px}.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:20px}.gallery h2{font-size:28px;margin:10px 0 0;letter-spacing:-.04em}.gallery-hint{color:#aaa6c0;font-size:12px}.saved-list{list-style:none;padding:0;margin:22px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.saved-card{background:linear-gradient(145deg,#1d1b38,#101426);border:1px solid #ffffff20;padding:18px;min-width:0}.saved-card strong{display:block;overflow-wrap:anywhere;color:#f4edff;font-size:16px}.saved-card small{display:block;color:#aaa4c5;margin:9px 0 16px}.saved-card button{border:1px solid #b6a4e155;background:#282443;color:#e9e2ff;padding:8px 11px;font-size:12px;cursor:pointer;margin-right:8px}.saved-card button:hover{background:#4b3f70}.empty-gallery{color:#aaa6c0;font-size:13px;margin-top:22px}.studio-actions{justify-content:flex-end}@media(max-width:650px){.studio{grid-template-columns:1fr;padding:18px}.studio-actions{justify-content:flex-start}.gallery-head{display:block}.gallery-hint{margin-top:10px}.saved-list{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="page"><header><a class="logo" href="/"><span>✳</span>AHICUE.</a><div class="tag">A LITTLE COSMIC PLAYGROUND</div></header><main><div class="heading"><div><div class="eyebrow">✦ &nbsp; CONSTELLATION PLAYGROUND</div><h1>造一座<span>星座。</span></h1><p class="intro">点亮几颗星，把它们连成一幅只属于你的星空。</p></div><div class="counter"><strong id="count">0</strong> 颗星已点亮</div></div><div id="sky" class="sky" role="group" aria-label="星空画布，按顺序选择星星以连接星座"><svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div class="sky-note">YOUR UNIVERSE / YOUR RULES ✦</div></div><div class="tools"><p id="message" aria-live="polite">选择一颗星星，开始你的星座。</p><div class="actions"><button id="undo" type="button" disabled>撤销上一颗</button><button id="clear" type="button" disabled>清空连线</button><button id="shuffle" class="primary" type="button">换一片星空 ✦</button></div></div><section class="studio" aria-labelledby="save-title"><div><label id="save-title" for="constellationName">给你的星座取个名字</label><input id="constellationName" maxlength="32" placeholder="例如：深夜小熊座" autocomplete="off"><p>保存的星座只留在当前浏览器，不会上传。刷新前记得保存。</p></div><div class="actions studio-actions"><button id="save" class="primary" type="button" disabled>保存星座 ✦</button><button id="export" type="button" disabled>下载图片 ↓</button></div></section><section class="gallery" aria-labelledby="gallery-title"><div class="gallery-head"><div><div class="eyebrow">✦ &nbsp; YOUR CONSTELLATIONS</div><h2 id="gallery-title">我的星座收藏</h2></div><div class="gallery-hint">收藏保存在这台设备的当前浏览器中</div></div><p id="emptyGallery" class="empty-gallery">还没有收藏，画好后给它取个名字吧。</p><ul id="savedList" class="saved-list"></ul></section></main><footer><span>© AHICUE · MAKE YOUR OWN CONSTELLATION</span><a href="/">返回首页 ↗</a></footer></div>
<script>
const sky = document.getElementById('sky');
const lines = document.getElementById('lines');
const count = document.getElementById('count');
const message = document.getElementById('message');
const nameInput = document.getElementById('constellationName');
const undo = document.getElementById('undo');
const clear = document.getElementById('clear');
const shuffle = document.getElementById('shuffle');
const save = document.getElementById('save');
const exportButton = document.getElementById('export');
const savedList = document.getElementById('savedList');
const emptyGallery = document.getElementById('emptyGallery');
const storageKey = 'ahicue-cosmos-constellations-v1';
let stars = [];
let chosen = [];
let dirty = false;

function makeSky(points) {
  sky.querySelectorAll('.star').forEach(star => star.remove());
  stars = points.map((point, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'star';
    button.style.left = point.x + '%';
    button.style.top = point.y + '%';
    button.style.setProperty('--size', point.size + 'px');
    button.setAttribute('aria-label', '星星 ' + (index + 1));
    button.addEventListener('click', () => {
      if (chosen.includes(index)) { message.textContent = '这颗星已经点亮，试试另一颗。'; return; }
      chosen.push(index);
      dirty = true;
      render();
    });
    sky.appendChild(button);
    return { ...point, button };
  });
}
function randomSky() {
  chosen = [];
  makeSky(Array.from({length: 28}, () => ({x: 5 + Math.random() * 90, y: 7 + Math.random() * 82, size: 3 + Math.random() * 4})));
  dirty = false;
  nameInput.value = '';
  render();
}
function render() {
  lines.replaceChildren();
  stars.forEach((star, index) => {
    const selected = chosen.includes(index);
    star.button.classList.toggle('selected', selected);
    star.button.setAttribute('aria-pressed', String(selected));
  });
  chosen.slice(1).forEach((index, i) => {
    const a = stars[chosen[i]], b = stars[index];
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    lines.appendChild(line);
  });
  count.textContent = chosen.length;
  undo.disabled = clear.disabled = chosen.length === 0;
  save.disabled = exportButton.disabled = chosen.length < 2;
  message.textContent = chosen.length ? '继续点亮星星，或者保存这片星空。' : '选择一颗星星，开始你的星座。';
}
function readSaved() {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (!Array.isArray(data)) return [];
    return data.filter(item => item && typeof item.id === 'string' && typeof item.name === 'string' && Array.isArray(item.stars) && item.stars.length > 0 && item.stars.length <= 100 && item.stars.every(p => p && Number.isFinite(p.x) && p.x >= 0 && p.x <= 100 && Number.isFinite(p.y) && p.y >= 0 && p.y <= 100 && Number.isFinite(p.size) && p.size > 0 && p.size <= 20) && Array.isArray(item.chosen) && item.chosen.length >= 2 && new Set(item.chosen).size === item.chosen.length && item.chosen.every(i => Number.isInteger(i) && i >= 0 && i < item.stars.length));
  } catch { return []; }
}
function writeSaved(items) {
  try { localStorage.setItem(storageKey, JSON.stringify(items)); return true; }
  catch { message.textContent = '保存失败：浏览器存储不可用或空间已满。'; return false; }
}
function renderGallery() {
  const items = readSaved();
  savedList.replaceChildren();
  emptyGallery.hidden = items.length > 0;
  items.slice().reverse().forEach(item => {
    const card = document.createElement('li'); card.className = 'saved-card';
    const title = document.createElement('strong'); title.textContent = item.name;
    const detail = document.createElement('small');
    const date = new Date(item.savedAt);
    detail.textContent = item.chosen.length + ' 颗星' + (Number.isNaN(date.getTime()) ? '' : ' · ' + date.toLocaleDateString('zh-CN'));
    const open = document.createElement('button'); open.type = 'button'; open.textContent = '打开';
    open.addEventListener('click', () => {
      if (dirty && chosen.length && !confirm('当前画布有未保存的星座，打开收藏会替换它。继续吗？')) return;
      chosen = item.chosen.slice(); makeSky(item.stars); nameInput.value = item.name; dirty = false; render();
      message.textContent = '已打开「' + item.name + '」，可以继续创作。';
      sky.scrollIntoView({behavior: 'smooth', block: 'center'});
    });
    const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '删除';
    remove.setAttribute('aria-label', '删除收藏 ' + item.name);
    remove.addEventListener('click', () => {
      if (!confirm('确定删除收藏「' + item.name + '」吗？')) return;
      if (writeSaved(readSaved().filter(entry => entry.id !== item.id))) { renderGallery(); message.textContent = '已删除收藏。'; }
    });
    card.append(title, detail, open, remove); savedList.appendChild(card);
  });
}
undo.addEventListener('click', () => { chosen.pop(); dirty = true; render(); });
clear.addEventListener('click', () => { chosen = []; dirty = true; render(); });
shuffle.addEventListener('click', () => {
  if (dirty && chosen.length && !confirm('当前画布有未保存的星座，换一片星空会清除它。继续吗？')) return;
  randomSky();
});
nameInput.addEventListener('input', () => { if (chosen.length) dirty = true; });
save.addEventListener('click', () => {
  const items = readSaved();
  if (items.length >= 50) { message.textContent = '收藏已满 50 个，请先删除一些作品。'; return; }
  const item = {id: Date.now().toString(36) + Math.random().toString(36).slice(2), name: nameInput.value.trim() || '未命名星座', stars: stars.map(({x,y,size}) => ({x,y,size})), chosen: chosen.slice(), savedAt: new Date().toISOString()};
  if (writeSaved([...items, item])) { nameInput.value = item.name; dirty = false; renderGallery(); message.textContent = '已保存「' + item.name + '」到这台设备。'; }
});
exportButton.addEventListener('click', () => {
  const canvas = document.createElement('canvas'); canvas.width = 1600; canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  if (!ctx) { message.textContent = '当前浏览器无法生成图片。'; return; }
  const bg = ctx.createLinearGradient(0, 0, 1600, 1000); bg.addColorStop(0, '#211631'); bg.addColorStop(.55, '#11182f'); bg.addColorStop(1, '#153344'); ctx.fillStyle = bg; ctx.fillRect(0, 0, 1600, 1000);
  ctx.fillStyle = 'rgba(225,215,255,.28)'; for (let x = 35; x < 1600; x += 83) for (let y = 35; y < 1000; y += 97) { ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI * 2); ctx.fill(); }
  const pos = star => [star.x * 16, star.y * 8.1 + 70];
  ctx.strokeStyle = '#d9c6ff'; ctx.lineWidth = 2; ctx.shadowColor = '#b89cff'; ctx.shadowBlur = 12; ctx.beginPath();
  chosen.forEach((index, i) => { const [x,y] = pos(stars[index]); if (i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }); ctx.stroke();
  stars.forEach((star, index) => { const [x,y] = pos(star); ctx.beginPath(); ctx.fillStyle = chosen.includes(index) ? '#fff' : '#d2c9ec'; ctx.shadowBlur = chosen.includes(index) ? 24 : 8; ctx.arc(x,y,star.size * (chosen.includes(index) ? 1.2 : .7),0,Math.PI * 2); ctx.fill(); });
  ctx.shadowBlur = 0; ctx.fillStyle = '#f5efff'; ctx.font = '600 38px system-ui, sans-serif'; ctx.fillText(nameInput.value.trim() || '未命名星座', 55, 935, 1300); ctx.fillStyle = '#b8abc9'; ctx.font = '18px system-ui, sans-serif'; ctx.fillText('AHICUE · YOUR UNIVERSE / YOUR RULES', 55, 970);
  canvas.toBlob(blob => {
    if (!blob) { message.textContent = '生成图片失败，请重试。'; return; }
    const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'ahicue-constellation.png'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); message.textContent = '星座图片已开始下载。';
  }, 'image/png');
});
randomSky(); renderGallery();

</script></body></html>
